<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Factbook FMCG 2026</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
</head>
<body class="p-4 bg-light">
  <div class="container-fluid">
    <h2 class="mb-4">🌍 CIA Factbook FMCG 2026</h2>
    <div class="table-responsive bg-white p-3 rounded shadow-sm">
      <table id="factTable" class="table table-striped table-hover">
        <thead>
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script>
    fetch('./factbook_data.json')
      .then(res => res.json())
      .then(data => {
        if (!data.length) return;
        
        const cols = ['Country', 'Population (2025 est.)', 'GDP (2024 est.) official ex rate', 'Inflation rate (2024 est.)', 'urban population', 'Languages'];
        const headerTr = document.getElementById('tableHeader');
        cols.forEach(c => headerTr.innerHTML += `<th>${c}</th>`);

        const tbody = document.getElementById('tableBody');
        data.forEach(row => {
          let tr = '<tr>';
          cols.forEach(c => {
            let val = row[c] ?? '-';
            if (typeof val === 'number' && val < 1 && val > 0) val = (val * 100).toFixed(1) + '%';
            if (typeof val === 'number' && val > 1000) val = val.toLocaleString();
            tr += `<td>${val}</td>`;
          });
          tr += '</tr>';
          tbody.innerHTML += tr;
        });

        $('#factTable').DataTable({ pageLength: 15, language: { search: "Rechercher un pays :" } });
      });
  </script>
</body>
</html>
